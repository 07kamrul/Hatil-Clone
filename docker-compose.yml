services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-furniture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-furniture}
      POSTGRES_DB: ${POSTGRES_DB:-furniture}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-furniture}"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: ${INSTALL_DEV:-false}
    restart: unless-stopped
    env_file: .env
    environment:
      SEED_DEMO: ${SEED_DEMO:-false}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-furniture}:${POSTGRES_PASSWORD:-furniture}@postgres:5432/${POSTGRES_DB:-furniture}
      UPLOAD_DIR: /app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      retries: 12
      start_period: 20s
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      PORT: 4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      retries: 12
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - uploads:/var/www/uploads:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/v1/health"]
      interval: 10s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
